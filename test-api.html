<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
</head>
<body>
    <h1>API Connection Test</h1>
    <button onclick="testAPI()">Test API Connection</button>
    <pre id="result"></pre>

    <script>
        async function testAPI() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Testing...';
            
            try {
                console.log('Sending request to http://localhost:3000/api/submissions');
                
                const response = await fetch('http://localhost:3000/api/submissions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: "API Test User",
                        penn_email: "apitest@upenn.edu",
                        gender: 1,
                        preferred_gender: 0,
                        schools: "2",
                        year_at_penn: 1,
                        preferred_match_years: "1",
                        race_ethnicity: "3",
                        preferred_match_race_ethnicity: "3,7",
                        social_events_enjoyment: 8,
                        communication_preference: 4,
                        planning_style: 8,
                        relationship_importance: 6,
                        physical_attraction_priority: 7,
                        locust_walk_reaction: 2,
                        open_to_polygamy: 1,
                        love_language: "3",
                        ideal_love_language: "3",
                        penn_love_language: 2,
                        emotionally_available: 1,
                        texting_style: 1,
                        spotify_wrapped_link: ""
                    })
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);
                
                resultEl.textContent = '✅ SUCCESS!\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('❌ Error:', error);
                resultEl.textContent = '❌ ERROR:\n' + error.message + '\n\n' + error.stack;
            }
        }
    </script>
</body>
</html>
